[project]
name = "checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dissect>=3.19",
    "pydantic>=2.0.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; platform_system != 'Linux'",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
    "yara-python>=4.5.4",
]

[project.scripts]
run-checks = "cli:main"

[tool.ruff]
line-length = 120

[tool.uv]
package=true
