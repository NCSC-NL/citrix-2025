[project]
name = "checker"
version = "1.0.0"
description = "Check for indicators on disk images of netscaler appliances."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dissect>=3.19",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
    "yara-python>=4.5.4",
]

[project.scripts]
run-checks = "cli:main"

[tool.ruff]
line-length = 120

[tool.uv]
package=true
