---
name: "Citrix Image IOC Checks"
checks:
  - check: timestomp
    confidence: medium
    args:
      paths:
        - /
      known_paths: []

  - check: webshell
    confidence: medium
    args:
      suspicious_contents:
        - array_filter(
        - base64_decode(
        - eval($_
        - http_status_code(
      paths:
        - /var
      known_paths:
        - /var/netscaler/gui/admin_ui/
        - /var/netscaler/websocketd/
        - /var/tmp/
      permission_confidence: medium

  - check: suspicious_content
    confidence: high
    args:
      checks:
        - name: nsconfig
          suspicious_contents:
            - python3 -c
            - httpd.conf
            - fnoc.dptth
            - php.xedni
            - relacsten
            - zlib.decompress
            - base64.b85decode
            - base64.b64decode
            - /var/tmp/sh
            - hs/pmt/rav/
            - apachectl graceful
            - lufecarg ltcehcapa
            - tnioPnogoL
            - gifnocsn
            - regex:#[\s]*php_flag engine off
          paths:
            - /nsconfig/
            - /etc/
          known_paths:
            - /etc/rc
            - /etc/rc.conf.defaults

        - name: portal_exfil
          suspicious_contents:
            # Loosen heads to also allow data: and blob: (no // for data:) and ports on host
            - 'regex:<script[^>]+src=["''](https?|data|blob):'
            - 'regex:fetch\(\s*["''](https?|data|blob):'
            - regex:(?s)xmlhttprequest.*?open\([^,]+,\s*["']https?://
            - regex:sendbeacon\(\s*["']https?://
            - 'regex:new\s+image\(\)\.src\s*=\s*["''](https?|data|blob):'
            - regex:on\w+\s*=\s*.*location\.(href|assign)\s*=["']https?://
            - regex:postMessage\(
            - regex:location\.(href|assign)\s*=
            - regex:window\.location\s*=
            - regex:(?:window|parent|top)\.location\s*=
            - regex:(?:window|parent|top)\.location\.(href|assign)\s*=
            - regex:new\s+WebSocket\(\s*["']wss?://
            - regex:new\s+EventSource\(\s*["']https?://
            - regex:navigator\.sendbeacon\(\s*["']https?://
            - regex:navigator\.clipboard\.write(Text)?\(
            - 'regex:fetch\(\s*`https?://'
            - 'regex:(?s)xmlhttprequest.*?open\([^,]+,\s*`https?://'
          paths:
            - /var/netscaler/logon
            - /var/netscaler/logon/LogonPoint
            - /var/netscaler/logon/themes
            - /var/vpn
            - /var/netscaler/portal
            - /netscaler/ns_gui/admin_ui
            - /netscaler/ns_gui/vpn
          known_paths: []
          extensions:
            - .html
            - .xhtml
            - .js
          allowlist_patterns:
            # Customize per org to reduce FPs
            - regex:https?://(www\.)?google-analytics\.com
            - regex:https?://(www\.)?googletagmanager\.com
            - regex:https?://ajax\.googleapis\.com
            - regex:https?://cdn\.jsdelivr\.net
            - regex:https?://cdnjs\.cloudflare\.com
            - regex:https?://code\.jquery\.com
            - regex:https?://cdn\.bootstrapcdn\.com
            - regex:https?://static\.hotjar\.com
            - regex:https?://cdn\.segment\.com
            - regex:https?://fonts\.googleapis\.com
            - regex:https?://fonts\.gstatic\.com
            - regex:https?://(www\.)?gstatic\.com
            - regex:https?://use\.typekit\.net
            - regex:https?://static\.cloudflareinsights\.com
            - regex:https?://cdn\.cloudflare\.com
            - regex:https?://ajax\.aspnetcdn\.com
            - regex:https?://static-cdn\.resources\.citrix\.com
            - regex:https?://login\.microsoftonline\.com
            - regex:https?://aadcdn\.msftauth\.net
            - regex:https?://(www\.)?okta\.com
            - regex:https?://oktastatic\.com
            - regex:https?://(www\.)?onelogin\.com
            - regex:https?://(www\.)?auth0\.com
            - regex:https?://(www\.)?pingidentity\.com
            - regex:https?://(www\.)?pingone\.com
        - name: portal_strings
          suspicious_contents:
            - regex:https?://[^"\s]+
          paths:
            - /var/netscaler/logon/themes
          known_paths: []
          extensions:
            - .json
          allowlist_patterns:
            - regex:https?://(www\.)?google-analytics\.com
            - regex:https?://(www\.)?googletagmanager\.com
            - regex:https?://ajax\.googleapis\.com
            - regex:https?://cdn\.jsdelivr\.net
            - regex:https?://cdnjs\.cloudflare\.com
            - regex:https?://code\.jquery\.com
            - regex:https?://cdn\.bootstrapcdn\.com
            - regex:https?://static\.hotjar\.com
            - regex:https?://cdn\.segment\.com
            - regex:https?://fonts\.googleapis\.com
            - regex:https?://fonts\.gstatic\.com
            - regex:https?://(www\.)?gstatic\.com
            - regex:https?://use\.typekit\.net
            - regex:https?://static\.cloudflareinsights\.com
            - regex:https?://cdn\.cloudflare\.com
            - regex:https?://ajax\.aspnetcdn\.com
            - regex:https?://static-cdn\.resources\.citrix\.com
            - regex:https?://login\.microsoftonline\.com
            - regex:https?://aadcdn\.msftauth\.net
            - regex:https?://(www\.)?okta\.com
            - regex:https?://oktastatic\.com
            - regex:https?://(www\.)?onelogin\.com
            - regex:https?://(www\.)?auth0\.com
            - regex:https?://(www\.)?pingidentity\.com
            - regex:https?://(www\.)?pingone\.com
        - name: portal_plugins
          suspicious_contents:
            - regex:<plugin[^>]+src=["']https?://[^"']+
            - regex:\bsrc=["']https?://[^"']+
          paths:
            - /var/netscaler/logon/LogonPoint
          known_paths: []
          extensions:
            - .xml
          allowlist_patterns:
            - regex:https?://(www\.)?google-analytics\.com
            - regex:https?://(www\.)?googletagmanager\.com
            - regex:https?://ajax\.googleapis\.com
            - regex:https?://cdn\.jsdelivr\.net
            - regex:https?://cdnjs\.cloudflare\.com
            - regex:https?://code\.jquery\.com
            - regex:https?://cdn\.bootstrapcdn\.com
            - regex:https?://static\.hotjar\.com
            - regex:https?://cdn\.segment\.com
            - regex:https?://fonts\.googleapis\.com
            - regex:https?://fonts\.gstatic\.com
            - regex:https?://(www\.)?gstatic\.com
            - regex:https?://use\.typekit\.net
            - regex:https?://static\.cloudflareinsights\.com
            - regex:https?://cdn\.cloudflare\.com
            - regex:https?://ajax\.aspnetcdn\.com
            - regex:https?://static-cdn\.resources\.citrix\.com
            - regex:https?://login\.microsoftonline\.com
            - regex:https?://aadcdn\.msftauth\.net
            - regex:https?://(www\.)?okta\.com
            - regex:https?://oktastatic\.com
            - regex:https?://(www\.)?onelogin\.com
            - regex:https?://(www\.)?auth0\.com
            - regex:https?://(www\.)?pingidentity\.com
            - regex:https?://(www\.)?pingone\.com

        - name: rc_persistence
          suspicious_contents:
            - regex:python3?\s+-c
            - regex:(curl|wget)[^\n]*\|\s*sh
            - regex:touch\s+-t
            - regex:nohup\s
            - regex:screen\s
            - regex:https?://
            - regex:([^0-9]|^)([0-9]{1,3}\.){3}[0-9]{1,3}([^0-9]|$)
          paths:
            - /flash/nsconfig/rc.netscaler
            - /etc/rc
            - /etc/rc.conf
            - /etc/rc.conf.local
            - /etc/rc.local
            - /etc/rc.d
          known_paths: []
  - check: yara
    confidence: high
    args:
      rule_files:
        - ./yara/thor-webshells.yar
        - ./yara/php_webshell_rules.yara
      paths:
        - /var
      max_file_size_kb: 1024

  - check: recent_changes
    confidence: medium
    args:
      paths:
        - /var/netscaler/logon
        - /var/netscaler/logon/LogonPoint
        - /var/netscaler/logon/themes
        - /var/vpn
        - /var/netscaler/portal
        - /netscaler/ns_gui/admin_ui
        - /netscaler/ns_gui/vpn
      days: 90
      extensions:
        - .php
        - .php3
        - .php4
        - .php5
        - .php7
        - .pht
        - .phtml
        - .inc
        - .shtml
        - .xhtml
        - .js
        - .html
        - .json
        - .css

  - check: tiny_backdoor
    confidence: high
    args:
      paths:
        - /var/netscaler/logon
        - /var/netscaler/logon/LogonPoint
        - /var/netscaler/logon/themes
        - /var/vpn
        - /var/netscaler/portal
        - /netscaler/ns_gui/admin_ui
        - /netscaler/ns_gui/vpn
      max_size_kb: 64
      extensions:
        - .php
        - .php3
        - .php4
        - .php5
        - .php7
        - .pht
        - .phtml
        - .inc
        - .shtml
      suspicious_patterns:
        - regex:system\s*\(
        - regex:shell_exec\s*\(
        - regex:passthru\s*\(
        - regex:(?<!\.)exec\s*\(
        - regex:popen\s*\(
        - regex:proc_open\s*\(
        - regex:base64_decode\s*\(
        - regex:assert\s*\(
        - regex:eval\s*\(
        - regex:preg_replace\s*\([^)]*\/e[^)]*\)
        - regex:atob\s*\(
        - regex:new\s+Function\s*\(

  - check: crontab
    confidence: high
    args:
      suspicious_contents:
        ip_address: '([0-9]{1,3}\.){3}[0-9]{1,3}'
        /var/tmp: /var/tmp
        nobody_user: nobody

  - check: binaries
    confidence: medium
    args:
      known_suid_binaries:
        - /bin/mount
        - /bin/ping
        - /bin/ping6
        - /bin/su
        - /bin/umount
        - /lib64/dbus-1/dbus-daemon-launch-helper
        - /netscaler/ping
        - /netscaler/ping6
        - /netscaler/traceroute
        - /netscaler/traceroute6
        - /opt/likewise/bin/ksu
        - /sbin/mksnap_ffs
        - /sbin/mount.nfs
        - /sbin/mount.nfs4
        - /sbin/pam_timestamp_check
        - /sbin/poweroff
        - /sbin/shutdown
        - /sbin/umount.nfs
        - /sbin/umount.nfs4
        - /sbin/unix_chkpwd
        - /usr/bin/at
        - /usr/bin/atq
        - /usr/bin/atrm
        - /usr/bin/chage
        - /usr/bin/chfn
        - /usr/bin/chsh
        - /usr/bin/crontab
        - /usr/bin/gpasswd
        - /usr/bin/lock
        - /usr/bin/login
        - /usr/bin/newgrp
        - /usr/bin/passwd
        - /usr/bin/sg
        - /usr/bin/staprun
        - /usr/bin/su
        - /usr/bin/sudo
        - /usr/bin/sudoedit
        - /usr/bin/yppasswd
        - /usr/libexec/openssh/ssh-keysign
        - /usr/libexec/ssh-keysign
        - /usr/sbin/ping6
        - /usr/sbin/userhelper
        - /usr/sbin/usernetctl
        - /var/netscaler/ping
        - /var/netscaler/ping6
        - /var/netscaler/traceroute
        - /var/netscaler/traceroute6
        - /var/sbin/mksnap_ffs
        - /var/sbin/shutdown
        - /var/sbin/poweroff
        - /var/usr/bin/crontab
        - /var/usr/bin/lock
        - /var/usr/bin/login
        - /var/usr/bin/passwd
        - /var/usr/bin/su
        - /var/usr/libexec/ssh-keysign
      known_guid_binaries:
        - /usr/bin/netstat
        - /usr/bin/wall
        - /usr/bin/write
        - /var/usr/bin/netstat
        - /var/usr/bin/wall
        - /var/usr/bin/write
        - /var/run/nsprofmgmt.pid
        - /var/run/nsmap.pid
        - /var/configd_devno

  - check: known_bad_files
    confidence: high
    args:
      files: []

  - check: magic_bytes
    confidence: medium
    args:
      paths:
        - /
      suspicious_bytes:
        pcap_microsecond: d4c3 b2a1
        pcap_nanosecond: 4d3c b2a1

  - check: ns_conf
    confidence: high
    args:
      path: /nsconfig/ns.conf
      suspicious_patterns:
        # Non-default theme bindings or external theme sources
        - regex:bind\s+vpn\s+vserver\s+\S+\s+.*-portaltheme\s+(?!Default)\w+
        - regex:add\s+vpn\s+portaltheme\s+\S+\s+.*-source\s+https?://
        # Responder policies injecting remote content or redirects
        - regex:add\s+responder\s+policy\s+.*https?://
        - regex:(?s)add\s+responder\s+action\s+.*?Q\("https?://
        # Clientless/non-default portal modes
        - regex:set\s+vpn\s+parameter\s+.*-clientlessVpnMode\s+ON
        # Additional rewrite/AAA pivots and toggles often abused
        - regex:add\s+rewrite\s+(policy|action)\s+.*https?://
        - regex:bind\s+rewrite\s+policylabel\s+\S+.*-\s*policyName\s+\S+
        - regex:set\s+vpn\s+parameter\s+.*-forceCleanup\s+ON
        - regex:set\s+vpn\s+vserver\s+\S+.*-clientlessAccess\s+ON
        - regex:add\s+(lb|cs)\s+vserver\s+\S+.*-redirURL\s+https?://
      allowlist_patterns:
        # Common IdP endpoints likely present in SSO flows
        - regex:https?://login\.microsoftonline\.com
        - regex:https?://aadcdn\.msftauth\.net
        - regex:https?://(www\.)?okta\.com
        - regex:https?://oktastatic\.com
        - regex:https?://(www\.)?onelogin\.com
        - regex:https?://(www\.)?auth0\.com
        - regex:https?://(www\.)?pingidentity\.com
        - regex:https?://(www\.)?pingone\.com

  - check: core_dump
    confidence: medium
    args:
      extract: true
      creation_date_threshold: 2025-05-01
